name: Add model to repo

# Triggered from the app (Download → Save to GitHub) or manually in Actions.
on:
  workflow_dispatch:
    inputs:
      model_key:
        description: Catalog model key to download into public/models
        required: true
        type: choice
        options:
          - kokoro-v1-balanced
          - kokoro-v1-quality
          - kokoro-v1-compact
          - kokoro-original

permissions:
  contents: write

concurrency:
  group: add-model
  cancel-in-progress: false

jobs:
  add-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Download model into public/models
        run: node scripts/download-model-for-key.mjs "${{ inputs.model_key }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Track large ONNX with LFS when present (fp32/q4 exceed 100MB)
          if command -v git-lfs >/dev/null 2>&1; then
            git lfs install --local
          fi
          git lfs track "*.onnx" 2>/dev/null || true
          git add .gitattributes 2>/dev/null || true

      - name: Commit and push model files
        run: |
          # Allow q8 always; large variants only if under hard limits or via LFS
          git add -f public/models || git add public/models
          if git diff --cached --quiet; then
            echo "No new model files to commit (already present)."
            exit 0
          fi
          KEY="${{ inputs.model_key }}"
          git commit -m "Add model ${KEY} to public/models (from app download)"
          git push origin HEAD:${{ github.ref_name }}